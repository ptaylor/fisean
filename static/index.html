<!DOCTYPE html>

     SPDX-FileCopyrightText: 2026 Paul Taylor -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>físeán</title>
<!-- The .ico first as the fallback, then the SVG, which current browsers prefer.
     The SVG is the icon; the .ico is for anything that cannot read one. -->
<link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="brand">
    <img class="mark" src="/static/icon.svg" width="22" height="22" alt="">
    <h1>físe<span>án</span></h1>
  </div>
  <span class="count" id="count"></span>
  <input type="search" id="q" placeholder="Search labels, summary, path…   /" aria-label="Search">
  <select id="sort" aria-label="Sort">
    <option value="date-desc">Newest first</option>
    <option value="date-asc">Oldest first</option>
    <option value="duration">Longest</option>
    <option value="sharpest">Sharpest</option>
    <option value="stills">Most stills</option>
    <option value="name">File name</option>
  </select>
  <button id="rail-toggle" title="Show or hide the filters">Filters</button>
  <button id="layout-toggle" title="Switch between the list and a grid of covers">Grid view</button>
  <span class="spacer"></span>
</header>
<div class="banner" id="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-close" title="Dismiss this notice" aria-label="Dismiss this notice">×</button>
</div>
<main>
  <aside id="rail"></aside>
  <section id="content"><div id="grid"></div></section>
</main>
<div id="backdrop" hidden></div>
<aside id="drawer" hidden></aside>
<div id="toast" hidden></div>
<!-- Shown while the records are fetched, and hidden again before the grid is
     rendered so the first thing seen is the library, never an empty page. -->
<div id="loading" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100"
     aria-valuenow="0" aria-label="Loading the index" aria-live="polite">
  <div class="loading-panel">
    <!-- The mark and the name, above the bar. Hidden from assistive technology:
         this element is a live region, so a name inside it would be announced
         again on every progress update, and the page title already says it. -->
    <div class="loading-brand" aria-hidden="true">
      <img class="loading-mark" src="/static/icon.svg" width="56" height="56" alt="">
      <p class="loading-name">físe<span>án</span></p>
    </div>
    <div class="loading-track"><div class="loading-fill"></div></div>
    <p class="loading-text">reading the index…</p>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
